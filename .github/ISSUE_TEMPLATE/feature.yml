name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could GameForge help? Mockups and examples welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app / UI
        - Agents
        - Game templates
        - Analyzer / fixes
        - CLI
        - MCP
        - Plugins / other engines
        - Documentation
        - Other
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The idea works without a mandatory cloud service, account or telemetry.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
